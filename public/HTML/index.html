<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/auth.css">
        <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
        <title>Create an Account</title>
    </head>
    <body>

        <div class="singup" id="signupBox">
            <form action="signup">
                <h2>Create Account</h2>
                <p>Start with just! Please enter your details.</p>

                <div class="fileds">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name"
                        placeholder="Enter your Name" required>
                </div>

                <div class="fileds">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                        placeholder="your@gmail.com" required>
                </div>

                <div class="fileds">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                        placeholder="create your Password" required>
                </div>
                <button type="submit" id="submit" class="submit">Sign
                    Up</button>

                <p class="alreadyAccount">
                    Already have an account? <a href="#"
                        id="showLogin">Login</a>
                </p>
            </form>
        </div>

        <div class="login" id="loginBox" style="display: none;">
            <form action="login">
                <h2>Login Account</h2>
                <p>Welcome back! Please enter your details.</p>

                <div class="fileds">
                    <label for="email">Email</label>
                    <input type="email" id="loginEmail" name="email"
                        placeholder="your@gmail.com" required>
                </div>

                <div class="fileds">
                    <label for="password">Password</label>
                    <input type="password" id="loginPassword" name="password"
                        placeholder="Enter your Password" required>
                </div>
                <button type="submit" class="loginSubmit"
                    id="loginSubmit">Login</button>
                <button type="button" class="forgetPassword"
                    id="forgetPassword">Forget Password</button>
                    <p class="login">
                    Create new account? <a href="#" id="showSignup">Sign Up</a>
                </p>
            </form>
        </div>
            <div id="forgetPasswordDiv" class="login fileds" style="display: none;">
                        <h2>Rest Password</h2>
                        <form id="forgetPasswordForm">
                            <label for="resetEmail">Enter Your Email:</label>
                            <input type="email" name="resetEmail" id="resetEmail" placeholder="Enter you email" required>
                            <button type="submit" class="sendResetMail">Send Reset Link</button>
                            <button type="button" id="backToLoginBtn" class="backToLoginBtn">Back to Login</button>
                        </form>
                    </div>
        <script src="../js/auth.js"></script>
    </body>
</html>
