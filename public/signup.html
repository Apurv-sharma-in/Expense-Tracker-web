<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="signup.css">
        <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>

        <title>Create an Account</title>
    </head>
    <body>

    <div class="singup">
        <form action="signup">
            <h2>Create Account</h2>
            <p>Start with just! Please enter your details.</p>

            <div class="fileds">
                <label for="name">Name</label>
                <input type="text" id="name" name="name"
                    placeholder="Enter your Name" required>
            </div>

            <div class="fileds">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                    placeholder="your@gmail.com" required>
            </div>

            <div class="fileds">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                    placeholder="create your Password" required>
            </div>
            <button type="submit" id="submit" class="submit">Sign Up</button>

            <p class="login">
                Already have an account? <a href="#">Login</a>
            </p>
        </form>
    </div>

    <script src="main.js"></script>
    </body>
</html>
